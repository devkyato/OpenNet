name: Feature proposal
description: Propose a compatible, testable improvement
title: "[Proposal]: "
labels: ["enhancement", "needs-discussion"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real use case cannot be handled today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and compatibility impact
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Can you help implement or test it?
      options:
        - Implement and test
        - Hardware-test
        - Review or document
        - Not currently
    validations:
      required: true
