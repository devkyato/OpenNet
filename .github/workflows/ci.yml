name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -e "./python[dev]"
      - run: python -m pytest python
      - if: matrix.python-version == '3.14'
        run: |
          python -m ruff check python
          python -m mypy python/src

  esp32:
    name: ESP32 Arduino compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install platformio
      - run: platformio run -e esp32dev

  package:
    name: Reproducible packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install build
      - run: python scripts/build_release.py
      - run: python -m build python
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/OpenNet-*.zip
            python/dist/*
          if-no-files-found: error
