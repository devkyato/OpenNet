[platformio]
default_envs = esp32dev
src_dir = examples/TelemetryClient

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_extra_dirs = .
build_flags = -Wall -Wextra

[env:native]
platform = native
framework =
test_framework = custom
lib_extra_dirs = .
build_flags =
  -std=c++17
  -I test/test_native
