[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opennet-protocol"
version = "0.1.0"
description = "Typed ONP/1 messaging for Raspberry Pi and backend systems"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "devkyato"}]
keywords = ["iot", "esp32", "raspberry-pi", "messaging", "tcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Networking"
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5"
]

[project.scripts]
opennet-server = "opennet.cli:main"

[project.urls]
Homepage = "https://github.com/devkyato/OpenNet"
Documentation = "https://github.com/devkyato/OpenNet/tree/main/docs"
Issues = "https://github.com/devkyato/OpenNet/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/opennet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["opennet"]
mypy_path = "src"
